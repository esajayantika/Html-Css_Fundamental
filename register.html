<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <title>Register</title>
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body>
    <header><img src="./public/Logo.svg" alt="logo video belajar" /></header>
    <div class="container-fluid">
      <form action="#" id="form">
        <!-- Group Header -->
        <div class="form-header">
          <h3>Pendaftaran Akun</h3>
          <p>Yuk, daftarkan akunmu sekarang juga!</p>
        </div>
        <!-- Group Name -->
        <div class="input-group">
          <label for="name">Nama Lengkap</label>
          <input type="text" id="name" />
        </div>
        <!-- Group email -->
        <div class="input-group">
          <label for="email">E-Mail </label>
          <input type="email" id="email" />
        </div>
        <!-- Group Jenis Kelamin -->
        <div class="input-group">
          <label for="gender">Jenis Kelamin </label>
          <select name="gender" id="gender">
            <option value="Pria">Pria</option>
            <option value="Wanita">Wanita</option>
          </select>
        </div>
        <!-- Group No.HP -->
        <div class="phone-group">
          <label for="phone-input">No.HP</label>
          <div class="phone-row">
            <div class="flag-box">
              <img src="./public/Indonesia (ID).svg" alt="indonesia" class="flag-icon" />
              <select name="code-number" id="code-number">
                <option value="+62">+62</option>
                <option value="+1">+1</option>
                <option value="+65">+65</option>
              </select>
            </div>
            <input type="tel" class="phone-input" />
          </div>
        </div>
        <!-- Group Password -->
        <div class="input-group">
          <label for="password">Kata Sandi </label>
          <div class="password-group">
            <input type="password" name="password" id="password" />
            <img src="./public/mdi_eye-off.svg" alt="Toggle Password" class="eye-icon" />
          </div>
        </div>
        <!-- Group Konfirmasi Password -->
        <div class="input-group">
          <label for="password">Konfirmasi Kata Sandi </label>
          <div class="password-group">
            <input type="password" name="password" id="password" />
            <img src="./public/mdi_eye-off.svg" alt="Toggle Password" class="eye-icon" />
          </div>
        </div>
        <a href="">Lupa Password?</a>
        <!-- Group Button -->
        <div class="button-group">
          <button type="submit" class="btn-primary">Masuk</button>
          <button type="button" class="btn-regis">Daftar</button>
        </div>
        <div class="divider">atau</div>
        <!-- Group Button SSO -->
        <button type="button" class="btn-google">
          <img src="./public/logos_google-icon.svg" alt="logo SSO" class="google-icon" />
          <span>Masuk dengan Google</span>
        </button>
      </form>
    </div>
  </body>
</html>
